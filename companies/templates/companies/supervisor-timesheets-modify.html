{% extends "companies/base.html" %}
{% block content %}

<h1>Sign Student Timesheet and Performance</h1>
<p>Student: {{ placement.student.get_full_name }}

<hr style="border-color: rgba(255,255,255,0.2); margin: 20px 0;">

<form method="POST" class="timesheet-form">
    {% csrf_token %}

    <label>Date 📅</label>
    <input 
        type="date" 
        name="date" 
        id="date-field" 
        required
        min="2026-01-01"
        max="2026-06-30"
    >

    <button type="button" class="secondary-btn" 
            style="margin-top: 5px; width: fit-content;"
            onclick="document.getElementById('date-field').value = new Date().toISOString().split('T')[0];">
        Select the Date Today 
    </button>


    <label>Hours Worked 🕐</label>
    <input type="number" step="0.25" name="hours_worked" placeholder="e.g. 8.0" min="0" max="12" required>

    <label>Performance Rating (1–5)</label>
    <select name="performance_rating" required>
        <option value="">Select rating ⭐️</option>
        {% for i in "12345" %}
            <option value="{{ i }}">{{ i }}</option>
        {% endfor %}
    </select>

    <label>Remarks 💭</label>
    <textarea name="remarks" rows="4" placeholder="Please let us know more about your rating."></textarea>

    <button class="primary-btn" type="submit">Save Entry</button>
</form>

<br>

<button class="secondary-btn" onclick="location.href='{% url 'supervisor_timesheets_view' placement.id %}'">
    View Student Timesheet
</button>

<style>
    .timesheet-form {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    label {
        opacity: 0.9;
        font-weight: 600;
    }

    input, select, textarea {
        padding: 10px;
        background: #273849;
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        border-radius: 6px;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #00bcd4;
    }

    .primary-btn {
        background: #4caf50;
        padding: 12px 20px;
        color: #ffffffff;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    .primary-btn:hover {
        background: #45a049;
    }

    .secondary-btn {
        background: #1F2A37;
        padding: 10px 18px;
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }

    .secondary-btn:hover {
        background: #273849;
    }
</style>

{% if saved %}
<script>
    alert("Timesheet updated successfully!");
</script>
{% endif %}

{% endblock %}
