{% extends "companies/base.html" %}
{% block content %}

<h1>Modify Timesheet – {{ placement.student.get_full_name }}</h1>
<p>Company: {{ placement.company_name }}</p>

<hr style="border-color: rgba(255,255,255,0.2); margin: 20px 0;">

<form method="POST" class="timesheet-form">
    {% csrf_token %}

    <label>Date</label>
    <input type="date" name="date" required>

    <label>Hours Worked</label>
    <input type="number" step="0.25" name="hours_worked" placeholder="e.g. 8.0" required>

    <label>Performance Rating (1–5)</label>
    <select name="performance_rating" required>
        <option value="">Select rating</option>
        {% for i in "12345" %}
            <option value="{{ i }}">{{ i }}</option>
        {% endfor %}
    </select>

    <label>Remarks</label>
    <textarea name="remarks" rows="4" placeholder="Optional notes..."></textarea>

    <button class="primary-btn" type="submit">Save Entry</button>
</form>

<br>

<button class="secondary-btn" onclick="location.href='{% url 'supervisor_timesheets_modify' placement.id %}'">
    Back to Timesheet
</button>

<style>
    .timesheet-form {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    label {
        opacity: 0.9;
        font-weight: 600;
    }

    input, select, textarea {
        padding: 10px;
        background: #273849;
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        border-radius: 6px;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #00bcd4;
    }

    .primary-btn {
        background: #00bcd4;
        padding: 12px 20px;
        color: #1F2A37;
        font-weight: bold;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    .primary-btn:hover {
        background: #0097a7;
    }

    .secondary-btn {
        background: #1F2A37;
        padding: 10px 18px;
        border: 1px solid rgba(255,255,255,0.2);
        color: white;
        border-radius: 6px;
        cursor: pointer;
    }

    .secondary-btn:hover {
        background: #273849;
    }
</style>

{% endblock %}
