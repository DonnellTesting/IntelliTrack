{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #1F2A37;
            color: white;
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 260px;
            background: #273849;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 0;
            box-shadow: 2px 0 5px rgba(0,0,0,0.4);
        }

        /* HEADER LOGO AREA */
        .sidebar-header {
            text-align: center;
            padding: 30px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .home-logo {
            display: block;
            margin: 0 auto 25px;
            width: 120px;
        }

        .home-logo img {
            width: 100%;
            height: auto;
            display: block;
        }

        .app-name {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .role-label {
            font-size: 14px;
            opacity: 0.7;
            font-weight: 600;
        }

        /* NAVIGATION */
        .nav-links {
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .nav-item {
            padding: 14px 25px;
            cursor: pointer;
            font-weight: 600;
            opacity: 0.9;
        }

        .nav-item:hover {
            background: #1F2A37;
            opacity: 1;
        }

        /* SUBMENU / DROPDOWN */
        .dropdown {
            display: none;
            flex-direction: column;
            background: #1C2833;
        }

        .dropdown a {
            padding: 12px 45px;
            text-decoration: none;
            color: #60A5FA;
            font-size: 14px;
            opacity: 0.9;
        }

        .dropdown a:hover {
            background: #0F172A;
            opacity: 1;
        }

        /* PROFILE SECTION */
        .profile-box {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            position: relative;
            margin-top: auto;
        }

        .profile-box:hover {
            background: #1F2A37;
        }

        .profile-name {
            font-weight: 600;
            opacity: 0.9;
        }

        .profile-dropdown {
            display: none;
            flex-direction: column;
            background: #1C2833;
            position: absolute;
            bottom: 60px;
            left: 20px;
            width: 200px;
            border-radius: 8px;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .profile-dropdown a {
            padding: 12px 15px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            opacity: 0.9;
        }

        .profile-dropdown a:hover {
            background: #0F172A;
            opacity: 1;
        }

        /* MAIN CONTENT */
        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }
    </style>

    <script>
        function toggleDropdown(id) {
            let menu = document.getElementById(id);
            menu.style.display = menu.style.display === "flex" ? "none" : "flex";
        }

        function toggleProfile() {
            let menu = document.getElementById("profileMenu");
            menu.style.display = menu.style.display === "flex" ? "none" : "flex";
        }
    </script>

</head>
<body>

<div class="sidebar">

    <!-- HEADER -->
    <div class="sidebar-header">
        <div class="home-logo">
            <img src="{% static 'teacher/resources/logo.png' %}" alt="IntelliTrack Logo">
        </div>
        <div class="app-name">IntelliTrack</div>
        <div class="role-label">Instructor</div>
    </div>

    <!-- NAVIGATION -->
    <div class="nav-links">

        <div class="nav-item" onclick="location.href='/instructor'">Home</div>

        <div class="nav-item" onclick="location.href='/instructor/class'">Class</div>

        <div class="nav-item" onclick="toggleDropdown('ojtMenu')">OJT Management ▾</div>
        <div id="ojtMenu" class="dropdown">
            <a href="/instructor/timesheets">Timesheets</a>
            <a href="/instructor/performance">Performance</a>
            <a href="/instructor/placements">OJT Placements</a>
        </div>

        <div class="nav-item" onclick="toggleDropdown('annMenu')">Announcements ▾</div>
        <div id="annMenu" class="dropdown">
            <a href="/instructor/announcements/create">Create Announcements</a>
            <a href="/instructor/announcements/view">View Announcements</a>
        </div>

    </div>

    <!-- PROFILE -->
    <div class="profile-box" onclick="toggleProfile()">
        <div class="profile-name">My Profile ▾</div>

        <div id="profileMenu" class="profile-dropdown">
            <a href="{% url 'profile' %}">Profile</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>

</div>

<!-- CONTENT -->
<div class="content-area">
    <h1>Welcome, Instructor!</h1>
    <p>Your dashboard controls appear on the left.</p>
</div>

</body>
</html>
