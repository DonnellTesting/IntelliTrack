<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instructor Dashboard</title>

<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #1F2A37;
        color: white;
        display: flex;
        height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
        width: 260px;
        background: #273849;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px 0;
        box-shadow: 2px 0 5px rgba(0,0,0,0.4);
    }

    .sidebar h2 {
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 30px;
        padding: 0 20px;
    }

    .nav-links {
        display: flex;
        flex-direction: column;
    }

    .nav-item {
        padding: 14px 25px;
        cursor: pointer;
        font-weight: 600;
        opacity: 0.9;
    }

    .nav-item:hover {
        background: #1F2A37;
        opacity: 1;
    }

    /* DROPDOWN */
    .dropdown {
        display: none;
        flex-direction: column;
        background: #1C2833;
    }

    .dropdown a {
        padding: 12px 40px;
        text-decoration: none;
        color: #60A5FA;
        font-size: 14px;
        opacity: 0.9;
    }

    .dropdown a:hover {
        opacity: 1;
        background: #0F172A;
    }

    /* FOOTER PROFILE */
    .profile-box {
        padding: 20px;
        border-top: 1px solid rgba(255,255,255,0.1);
        cursor: pointer;
        position: relative;
    }

    .profile-box:hover {
        background: #1F2A37;
    }

    .profile-name {
        font-weight: 600;
        opacity: 0.9;
    }

    .profile-dropdown {
        display: none;
        flex-direction: column;
        background: #1C2833;
        position: absolute;
        bottom: 60px;
        left: 20px;
        width: 200px;
        border-radius: 8px;
        box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }

    .profile-dropdown a {
        padding: 12px 15px;
        text-decoration: none;
        color: white;
        font-size: 14px;
        opacity: 0.9;
    }

    .profile-dropdown a:hover {
        background: #0F172A;
        opacity: 1;
    }

    /* MAIN CONTENT */
    .content-area {
        flex: 1;
        padding: 40px;
        overflow-y: auto;
    }

</style>

<script>
    // Toggle dropdowns
    function toggleDropdown(id) {
        let menu = document.getElementById(id);
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    }

    function toggleProfile() {
        let menu = document.getElementById("profileMenu");
        menu.style.display = menu.style.display === "flex" ? "none" : "flex";
    }
</script>

</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">

    <div>
        <h2>Instructor Panel</h2>

        <div class="nav-links">

            <div class="nav-item">Home</div>

            <div class="nav-item">Class</div>

            <div class="nav-item" onclick="toggleDropdown('ojtMenu')">
                OJT Management ▾
            </div>
            <div id="ojtMenu" class="dropdown">
                <a href="#">Timesheets</a>
                <a href="#">Performance</a>
                <a href="#">OJT Placements</a>
            </div>

            <div class="nav-item" onclick="toggleDropdown('annMenu')">
                Announcements ▾
            </div>
            <div id="annMenu" class="dropdown">
                <a href="#">Create Announcements</a>
                <a href="#">View Announcements</a>
            </div>

        </div>
    </div>

    <!-- FOOTER PROFILE -->
    <div class="profile-box" onclick="toggleProfile()">
        <div class="profile-name">John Instructor</div>
    </div>

    <div id="profileMenu" class="profile-dropdown">
        <a href="#">Profile</a>
        <a href="/logout">Logout</a>
    </div>

</div>

<!-- MAIN CONTENT -->
<div class="content-area">
    <h1>Welcome, Instructor!</h1>
    <p>This is your dashboard. Content will be displayed here depending on what you select in the sidebar.</p>
</div>

</body>
</html>
