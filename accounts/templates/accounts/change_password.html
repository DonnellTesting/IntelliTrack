{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1F2A37;
            margin: 0;
            padding: 0;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 70px auto;
            background: #273849;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 26px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            opacity: .8;
            display: block;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #1F2A37;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
        }

        input:focus {
            outline: none;
            border-color: #3B82F6;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #3B82F6;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: #1D4ED8;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #93C5FD;
            text-decoration: none;
        }

        .back-link:hover {
            color: #BFDBFE;
        }

        /* Logo / Home button */
        .home-logo {
            display: block;
            margin: 0 auto 25px; /* center and spacing below */
            width: 120px; /* adjust size as needed */
        }

        .home-logo img {
            width: 100%;
            height: auto; /* preserves aspect ratio */
            display: block;
    }

    </style>
</head>
<body>

<div class="container">

    <a href="{% url 'profile' %}" class="home-logo">
      <img src="{% static 'accounts/resources/logo.png' %}" alt="IntelliTrack Logo" />
    </a>

    <h1>Change Password</h1>

    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p style="color:#FCA5A5; font-size:14px;">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}

        <button type="submit" class="btn">Update Password</button>

        <a href="{% url 'profile' %}" class="back-link">← Back to Profile</a>
    </form>
</div>

</body>
</html>
