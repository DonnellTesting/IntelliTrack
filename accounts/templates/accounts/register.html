<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – IntelliTrack</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #1F2A37; /* dark background */
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 460px;
      width: 100%;
      background: rgba(255,255,255,0.07); /* glass-like card */
      padding: 35px 45px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      backdrop-filter: blur(12px);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 28px;
      font-weight: 700;
      color: white;
    }

    p.description {
      text-align: center;
      margin-bottom: 25px;
      font-size: 15px;
      color: #cfd8e3;
    }

    label {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      font-weight: 600;
      color: #cfd8e3;
      text-align: left;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #273849; /* dark input */
      color: white;
      font-size: 15px;
      margin-bottom: 20px;
    }

    input::placeholder {
      color: #b0b8c1; /* subtle placeholder */
    }

    input:focus, select:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.25); /* accent focus */
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      background: #3B82F6; /* accent blue */
      color: white;
      cursor: pointer;
      transition: background 0.25s ease;
      margin-top: 5px;
    }

    button:hover {
      background: #2563eb;
    }

    .footer-links {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
    }

    .footer-links a {
      color: #60A5FA; /* theme accent */
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .name-group {
      display: flex;
      gap: 15px;
    }

    .name-group input {
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="container">

    <h2>Create an account</h2>
    <p class="description">Enter your details below to create your account</p>

    <form action="/register" method="POST">
      {% csrf_token %}

      <label>First Name</label>
      <input type="text" name="first_name" placeholder="First Name" required />

      <label>Last Name</label>
      <input type="text" name="last_name" placeholder="Last Name" required />

      <label>Email</label>
      <input type="email" name="email" placeholder="email@example.com" required />

      <label>Username</label>
      <input type="text" name="username" placeholder="example-username" required />

      <label>Password</label>
      <input type="password" name="password" required />

      <label>Confirm Password</label>
      <input type="password" name="confirm_password" required />

      <label>Select a Role</label>
      <select name="role" required>
        <option value="" disabled selected>Choose role...</option>
        <option value="student">Student</option>
        <option value="instructor">Instructor</option>
        <option value="company">Company Supervisor</option>
        <option value="admin">Administrator</option>
      </select>

      <button type="submit">Create account</button>
    </form>

    <div class="footer-links">
      Already have an account? <a href="/login">Log in</a>
    </div>
  </div>
</body>
</html>
