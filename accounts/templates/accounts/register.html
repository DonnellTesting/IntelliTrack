{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account – IntelliTrack</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #1F2A37;
        color: white;
    }

    .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        text-align: center;
    }

    .card {
        padding: 40px 35px;
        border-radius: 18px;
        max-width: 460px;
        width: 100%;
        {% comment %} background: rgba(255,255,255,0.07);
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        backdrop-filter: blur(12px); {% endcomment %}
    }

    .title {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 12px;
        color: white;
    }

    .subtitle {
        font-size: 15px;
        opacity: 0.9;
        margin-bottom: 25px;
        color: white;
    }

    .input-group {
        margin-bottom: 18px;
        display: flex;
        flex-direction: column;
        color: white;
    }

    label {
        font-size: 14px;
        margin-bottom: 6px;
        color: #cfd8e3;
    }

    /* Smaller placeholder text */
    input::placeholder,
    select::placeholder {
      font-size: 12px; /* smaller than the default 15px */
      color: #b0b8c1; /* optional, keep the same subtle color */
      text-align: left; /* if you still want it centered */
    }


    input, select {
      padding: 12px 14px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 15px;
      background: #273849;
      color: white;
      text-align: center; /* also center the typed text */
    }

    input:focus, select:focus {
        box-shadow: 0 0 0 2px rgba(59,130,246,0.25);
    }

    .name-group {
        display: flex;
        gap: 15px;
    }

    .name-group input {
        width: 100%;
    }

    .btn {
        width: 100%;
        padding: 14px;
        background-color: #3B82F6;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 5px;
    }

    .btn:hover {
        background-color: #2563eb;
    }

    .footer-text {
        margin-top: 18px;
        text-align: center;
        font-size: 14px;
        opacity: 0.8;
    }

    .footer-text a {
        color: #60A5FA;
        text-decoration: none;
        font-weight: bold;
    }

    .footer-text a:hover {
        text-decoration: underline;
    }

    /* Logo / Home button */
    .home-logo {
        display: block;
        margin: 0 auto 25px;
        width: 120px;
    }

    .home-logo img {
        width: 100%;
        height: auto;
        display: block;
    }

</style>
</head>

<body>

<div class="container">
    <div class="card">

        <a href="/" class="home-logo">
            <img src="{% static 'accounts/resources/logo.png' %}" alt="IntelliTrack Logo" />
        </a>

        <div class="title">Create an account</div>

        <div class="subtitle">
            Enter your details below to create your account
        </div>

        <form action="/register" method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label>First Name</label>
                <input type="text" name="first_name" placeholder="First Name" required>
            </div>

            <div class="input-group">
                <label>Last Name</label>
                <input type="text" name="last_name" placeholder="Last Name" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="email@example.com" required>
            </div>

            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="example-username" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="example-password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="confirm-password" required>
            </div>

            <div class="input-group">
                <label>Select a Role</label>
                <select name="role" required>
                    <option value="" disabled selected>Choose role...</option>
                    <option value="student">Student</option>
                    <option value="instructor">Instructor</option>
                    <option value="company">Company Supervisor</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <button class="btn" type="submit">Create account</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="/login">Log in</a>
        </div>

    </div>
</div>

</body>
</html>
