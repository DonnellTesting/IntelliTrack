{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1F2A37;
            margin: 0;
            padding: 0;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            background: #273849;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        .label {
            font-weight: bold;
            opacity: .8;
        }

        .value {
            padding: 10px;
            margin-top: 6px;
            background: #1F2A37;
            border-radius: 8px;
        }

        .buttons {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }

        .btn {
            padding: 12px 18px;
            background: #3B82F6;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            flex: 1;
            margin: 0 5px;
        }

        .btn:hover {
            background: #1D4ED8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>My Profile</h1>

    <div class="field">
        <div class="label">Full Name</div>
        <div class="value">{{ request.user.first_name }} {{ request.user.last_name }}</div>
    </div>

    <div class="field">
        <div class="label">Username</div>
        <div class="value">{{ request.user.username }}</div>
    </div>

    <div class="field">
        <div class="label">Email</div>
        <div class="value">{{ request.user.email }}</div>
    </div>

    <div class="field">
        <div class="label">Role</div>
        <div class="value">{{ request.user.role|title }}</div>
    </div>

    <div class="buttons">
        <a href="/accounts/change-password/" class="btn">Change Password</a>
        <a href="/logout/" class="btn" style="background:#EF4444;">Logout</a>
    </div>
</div>

</body>
</html>
