<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – IntelliTrack</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #1a1a1a;
    }

    .container {
      max-width: 420px;
      margin: 70px auto;
      background: white;
      padding: 35px 40px;
      border-radius: 14px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
    }

    p.description {
      text-align: center;
      margin-bottom: 25px;
      font-size: 15px;
      color: #5b5b5b;
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d4d4d4;
      font-size: 15px;
      margin-bottom: 20px;
    }

    input[type="email"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      background: #2563eb;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #1e4ecb;
    }

    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .footer-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    /* Success message */
    .success-box {
      text-align: center;
      padding: 20px;
      display: none;
    }

    .success-box h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .success-box p {
      color: #4b4b4b;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2 id="title">Forgot password</h2>
    <p class="description" id="subtitle">Enter your email to receive a password reset link</p>

    <form id="resetForm" action="/reset-password" method="POST">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="email@example.com" required />

      <button type="submit">Email password reset link</button>
    </form>

    <div class="success-box" id="successMessage">
      <h3>Check your email</h3>
      <p>We’ve sent you a password reset link.</p>
      <a href="/login" style="color:#2563eb; font-weight:600;">Return to log in</a>
    </div>

    <div class="footer-links" id="footerLinks">
      Or, return to <a href="/login">log in</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("resetForm");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const successBox = document.getElementById("successMessage");
    const footerLinks = document.getElementById("footerLinks");

    form.addEventListener("submit", function (e) {
      e.preventDefault(); // prevent actual submit for now

      // Simulate success — backend email send happens here normally
      form.style.display = "none";
      footerLinks.style.display = "none";

      title.textContent = "Email Sent!";
      subtitle.textContent = "";

      successBox.style.display = "block";
    });
  </script>
</body>
</html>
