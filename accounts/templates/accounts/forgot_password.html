<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – IntelliTrack</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #1F2A37; /* page background */
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 420px;
      width: 100%;
      padding: 35px 40px;
      border-radius: 18px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 700;
      color: white;
    }

    p.description {
      margin-bottom: 25px;
      font-size: 15px;
      color: #cfd8e3;
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #cfd8e3;
      text-align: left;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #273849; /* dark input background */
      color: white;
      font-size: 15px;
      margin-bottom: 20px;
    }

    input::placeholder {
      color: #b0b8c1; /* subtle placeholder */
    }

    input[type="email"]:focus {
      outline: none;
      border: none;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.25); /* accent blue focus */
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      background: #3B82F6; /* accent blue */
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #2563eb;
    }

    .footer-links {
      margin-top: 20px;
      font-size: 14px;
    }

    .footer-links a {
      color: #60A5FA; /* theme accent */
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    /* Success message */
    .success-box {
      text-align: center;
      padding: 20px;
      display: none;
      color: white;
    }

    .success-box h3 {
      font-size: 22px;
      margin-bottom: 10px;
      color: white;
    }

    .success-box p {
      color: #cfd8e3;
      margin-bottom: 20px;
    }

    .success-box a {
      color: #60A5FA;
      font-weight: 600;
      text-decoration: none;
    }

    .success-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2 id="title">Forgot password</h2>
    <p class="description" id="subtitle">Enter your email to receive a password reset link</p>

    <form id="resetForm" action="/reset-password" method="POST">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="email@example.com" required />

      <button type="submit">Email password reset link</button>
    </form>

    <div class="success-box" id="successMessage">
      <h3>Check your email</h3>
      <p>We’ve sent you a password reset link.</p>
      <a href="/login">Return to log in</a>
    </div>

    <div class="footer-links" id="footerLinks">
      Or, return to <a href="/login">log in</a>
    </div>
  </div>

  <script>
    const form = document.getElementById("resetForm");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const successBox = document.getElementById("successMessage");
    const footerLinks = document.getElementById("footerLinks");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      form.style.display = "none";
      footerLinks.style.display = "none";

      title.textContent = "Email Sent!";
      subtitle.textContent = "";

      successBox.style.display = "block";
    });
  </script>
</body>
</html>
