<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password – IntelliTrack</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f9fc;
      color: #1a1a1a;
    }

    .container {
      max-width: 420px;
      margin: 70px auto;
      background: white;
      padding: 35px 40px;
      border-radius: 14px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.08);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
    }

    p.description {
      text-align: center;
      margin-bottom: 25px;
      font-size: 15px;
      color: #5b5b5b;
    }

    label {
      font-size: 14px;
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #d4d4d4;
      font-size: 15px;
      margin-bottom: 18px;
    }

    input[type="password"]:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      background: #2563eb;
      color: white;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: 5px;
    }

    button:hover {
      background: #1e4ecb;
    }

    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .footer-links a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

        /* Logo / Home button */
    .home-logo {
        display: block;
        margin: 0 auto 25px; /* center and spacing below */
        width: 120px; /* adjust size as needed */
    }

    .home-logo img {
        width: 100%;
        height: auto; /* preserves aspect ratio */
        display: block;
    }
    
  </style>
</head>

<body>
  <div class="container">

    {% load static %}
    <a href="/" class="home-logo">
      <img src="{% static 'accounts/resources/logo.png' %}" alt="IntelliTrack Logo" />
    </a>

    <h2>Reset password</h2>
    <p class="description">Please enter your new password below</p>

    <form action="/reset-password/confirm" method="POST">
      <label for="password">New password</label>
      <input type="password" id="password" name="password" placeholder="Enter new password" required>

      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>

      <button type="submit">Reset password</button>
    </form>

    <div class="footer-links">
      <a href="/login">Return to log in</a>
    </div>
  </div>
</body>
</html>
