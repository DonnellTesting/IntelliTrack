<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntelliTrack – Login</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom right, #0a1a2f, #1a3d60);
        color: #fff;
    }

    .container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .card {
        background: rgba(255, 255, 255, 0.07);
        padding: 40px 35px;
        border-radius: 18px;
        max-width: 420px;
        width: 100%;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .title {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    .subtitle {
        font-size: 15px;
        opacity: 0.8;
        margin-bottom: 25px;
    }

    .input-group {
        margin-bottom: 18px;
        display: flex;
        flex-direction: column;
        color: #000;
    }

    label {
        font-size: 14px;
        margin-bottom: 6px;
        color: #d0d0d0;
    }

    input, select {
        padding: 12px 14px;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 15px;
        background: #ffffff;
    }

    .forgot {
        margin-top: -10px;
        margin-bottom: 20px;
        text-align: right;
    }

    .forgot a {
        color: #77b2ff;
        text-decoration: none;
        font-size: 14px;
    }

    .forgot a:hover {
        text-decoration: underline;
    }

    .btn {
        width: 100%;
        padding: 14px;
        background-color: #3b82f6;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 5px;
    }

    .btn:hover {
        background-color: #2563eb;
    }

    .footer-text {
        margin-top: 18px;
        text-align: center;
        font-size: 14px;
        opacity: 0.8;
    }

    .footer-text a {
        color: #77b2ff;
        text-decoration: none;
        font-weight: bold;
    }

    .footer-text a:hover {
        text-decoration: underline;
    }
</style>

</head>
<body>

<div class="container">
    <div class="card">
        <div class="title">Log in to your account</div>

        <div class="subtitle">
            Enter your username and password below to access your IntelliTrack account.
        </div>

        {% if error %}
            <div style="color: #ff5555; margin-bottom: 15px; text-align: center;">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login/" method="POST">
            <!-- Username -->
            <div class="input-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="example123" required>
            </div>

            <!-- Forgot Password -->
            <div class="forgot">
                <a href="/forgot-password">Forgot password?</a>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <!-- Role -->
            <div class="input-group">
                <label>Select Role</label>
                <select name="role" required>
                    <option value="student">Student</option>
                    <option value="instructor">Instructor</option>
                    <option value="company">Company Supervisor</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <button class="btn">Log in</button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="/register">Sign up</a>
        </div>
    </div>
</div>

</body>
</html>
